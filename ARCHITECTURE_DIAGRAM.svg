<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="100%" height="100%" style="background-color: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="greyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    
    <!-- Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    
    <!-- Markers for arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0ea5e9" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Title Panel -->
  <g transform="translate(40, 40)">
    <text x="0" y="0" font-size="24" font-weight="bold" fill="#f8fafc" letter-spacing="0.5">US Retailer Product Knowledge Graph</text>
    <text x="0" y="24" font-size="14" fill="#94a3b8">System Architecture, Data Flow, and ETL Pipeline</text>
  </g>

  <!-- ================= SECTION 1: ARCHITECTURE FLOW ================= -->
  <!-- Box borders -->
  <rect x="30" y="100" width="600" height="660" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
  <text x="50" y="130" font-size="16" font-weight="bold" fill="#38bdf8">1. Application Architecture &amp; Data Flow</text>

  <!-- 1.1 UX Client Node -->
  <g transform="translate(230, 160)" filter="url(#shadow)">
    <rect x="0" y="0" width="200" height="70" rx="8" fill="url(#pinkGrad)" />
    <text x="100" y="32" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">UI Dashboard (SPA)</text>
    <text x="100" y="50" font-size="11" fill="#fbcfe8" text-anchor="middle">D3.js / Tailwind CSS / Vanilla JS</text>
  </g>

  <!-- 1.2 Hono Web Server Node -->
  <g transform="translate(230, 300)" filter="url(#shadow)">
    <rect x="0" y="0" width="200" height="85" rx="8" fill="url(#orangeGrad)" />
    <text x="100" y="30" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Hono API Server</text>
    <text x="100" y="48" font-size="11" fill="#ffedd5" text-anchor="middle">Runs Natively on Bun Runtime</text>
    <text x="100" y="66" font-size="11" fill="#ffedd5" text-anchor="middle">Service &amp; Repository Layer</text>
  </g>

  <!-- 1.3 LLM Service Node -->
  <g transform="translate(410, 450)" filter="url(#shadow)">
    <rect x="0" y="0" width="180" height="75" rx="8" fill="url(#purpleGrad)" />
    <text x="90" y="28" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Gemini LLM Service</text>
    <text x="90" y="46" font-size="11" fill="#f3e8ff" text-anchor="middle">API-based Ingest &amp; NLQ</text>
    <text x="90" y="62" font-size="10" fill="#f3e8ff" text-anchor="middle">Optional key from AWS Secrets</text>
  </g>

  <!-- 1.4 PostgreSQL Database Node -->
  <g transform="translate(70, 560)" filter="url(#shadow)">
    <!-- Cylinder database graphic -->
    <path d="M 0 15 A 90 15 0 0 1 180 15 L 180 85 A 90 15 0 0 1 0 85 Z" fill="url(#blueGrad)" />
    <ellipse cx="90" cy="15" rx="90" ry="15" fill="#38bdf8" />
    <text x="90" y="50" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">PostgreSQL</text>
    <text x="90" y="68" font-size="11" fill="#e0f2fe" text-anchor="middle">Relational Catalog &amp; Cache</text>
    <text x="90" y="82" font-size="9" fill="#bae6fd" text-anchor="middle">caching_tables.sql (375k rows)</text>
  </g>

  <!-- 1.5 Neo4j Database Node -->
  <g transform="translate(390, 560)" filter="url(#shadow)">
    <path d="M 0 15 A 90 15 0 0 1 180 15 L 180 85 A 90 15 0 0 1 0 85 Z" fill="url(#greenGrad)" />
    <ellipse cx="90" cy="15" rx="90" ry="15" fill="#34d399" />
    <text x="90" y="50" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Neo4j Enterprise</text>
    <text x="90" y="68" font-size="11" fill="#ecfdf5" text-anchor="middle">Semantic Knowledge Graph</text>
    <text x="90" y="82" font-size="9" fill="#a7f3d0" text-anchor="middle">neo4j.dump (3.4M products)</text>
  </g>

  <!-- ARCHITECTURE FLOW CONNECTIONS (ARROWS) -->
  <!-- UX Client <--> Hono (Bi-directional) -->
  <path d="M 315 230 L 315 300" fill="none" stroke="#ec4899" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)" />
  <text x="325" y="265" font-size="11" fill="#fbcfe8">REST / D3 Nodes</text>

  <!-- Hono --> PostgreSQL (Read/Write) -->
  <path d="M 230 360 C 150 380, 140 470, 150 545" fill="none" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="105" y="445" font-size="11" fill="#bae6fd" text-anchor="middle">SQL Query / Cache Check</text>

  <!-- Hono --> Neo4j (Cypher Sessions) -->
  <path d="M 330 385 L 330 550" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow-green)" />
  <text x="338" y="445" font-size="11" fill="#a7f3d0">Bolt / Cypher</text>

  <!-- Hono <--> LLM Service -->
  <path d="M 390 385 C 440 405, 450 420, 470 450" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#arrow)" />
  <text x="475" y="415" font-size="11" fill="#f3e8ff">API Prompts</text>

  <!-- ETL Stream: Postgres --> Neo4j (via Hono) -->
  <path d="M 190 560 C 230 500, 340 500, 380 560" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)" />
  <text x="285" y="525" font-size="11" fill="#fed7aa" text-anchor="middle">pg-query-stream ETL</text>

  <!-- ================= SECTION 2: ETL FLOW ================= -->
  <rect x="660" y="100" width="410" height="660" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
  <text x="680" y="130" font-size="16" font-weight="bold" fill="#34d399">2. Ingest &amp; ETL Pipeline Flow (run-etl.ts)</text>

  <!-- Stage Box Template Macro -->
  <!-- Stage A -->
  <g transform="translate(680, 160)">
    <rect x="0" y="0" width="370" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="25" cy="25" r="14" fill="#ef4444" />
    <text x="25" y="29" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">A</text>
    <text x="55" y="22" font-size="12" font-weight="bold" fill="#f8fafc">Truncate Neo4j &amp; Set Constraints</text>
    <text x="55" y="38" font-size="10" fill="#94a3b8">Wipes graph, establishes unique indices on IDs.</text>
  </g>
  <path d="M 865 210 L 865 240" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Stage B -->
  <g transform="translate(680, 240)">
    <rect x="0" y="0" width="370" height="65" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="25" cy="32" r="14" fill="#3b82f6" />
    <text x="25" y="36" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">B</text>
    <text x="55" y="24" font-size="12" font-weight="bold" fill="#f8fafc">Category Topology &amp; Relationships</text>
    <text x="55" y="42" font-size="10" fill="#94a3b8">Loads hierarchy. Queries pgvector + checks cache.</text>
    <text x="55" y="55" font-size="9" fill="#0ea5e9">Generates COMPLEMENTARY_TO &amp; SUBSTITUTE_CATEGORY</text>
  </g>
  <path d="M 865 305 L 865 335" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Stage C -->
  <g transform="translate(680, 335)">
    <rect x="0" y="0" width="370" height="65" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="25" cy="32" r="14" fill="#10b981" />
    <text x="25" y="36" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">C</text>
    <text x="55" y="24" font-size="12" font-weight="bold" fill="#f8fafc">Brand &amp; Corporate Topology</text>
    <text x="55" y="42" font-size="10" fill="#94a3b8">Loads Brands/Manufacturers. Queries pgvector + checks cache.</text>
    <text x="55" y="55" font-size="9" fill="#34d399">Generates Brand-level COMPETES_WITH edges</text>
  </g>
  <path d="M 865 400 L 865 430" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- LLM Queue box linking to B & C -->
  <g transform="translate(730, 430)">
    <rect x="0" y="0" width="270" height="40" rx="4" fill="#2e1065" stroke="#7c3aed" stroke-width="1" />
    <text x="135" y="24" font-size="11" font-weight="bold" fill="#d8b4fe" text-anchor="middle">Self-Healing LLM Ingest Queue (429 Retries)</text>
  </g>
  <path d="M 865 470 L 865 490" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Stage D -->
  <g transform="translate(680, 490)">
    <rect x="0" y="0" width="370" height="65" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="25" cy="32" r="14" fill="#f59e0b" />
    <text x="25" y="36" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">D</text>
    <text x="55" y="24" font-size="12" font-weight="bold" fill="#f8fafc">High-Performance Product Streamer</text>
    <text x="55" y="42" font-size="10" fill="#94a3b8">Uses pg-query-stream with backpressure controls.</text>
    <text x="55" y="55" font-size="9" fill="#f59e0b">Batch UNWIND writes (15k size) maps BELONGS_TO edges</text>
  </g>
  <path d="M 865 555 L 865 585" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Stage G -->
  <g transform="translate(680, 585)">
    <rect x="0" y="0" width="370" height="65" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="25" cy="32" r="14" fill="#ec4899" />
    <text x="25" y="36" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">G</text>
    <text x="55" y="24" font-size="12" font-weight="bold" fill="#f8fafc">Materialize Brand-Category Footprints</text>
    <text x="55" y="42" font-size="10" fill="#94a3b8">Post-processing query: Brand &lt;- Product -&gt; Category.</text>
    <text x="55" y="55" font-size="9" fill="#f472b6">Materializes direct OPERATES_IN edges (productCount)</text>
  </g>
  <path d="M 865 650 L 865 680" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Success Node -->
  <g transform="translate(730, 680)">
    <rect x="0" y="0" width="270" height="40" rx="20" fill="url(#greenGrad)" />
    <text x="135" y="25" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Knowledge Graph Active 🚀</text>
  </g>
</svg>
